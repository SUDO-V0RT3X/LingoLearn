# CI disabled 
workflow:
  rules:
    - when: never

test-and-deploy:
  tags: [lingolearn-deploy]
  variables:
    NODE_OPTIONS: --max-old-space-size=1024
  script:
    - echo "CI disabled"

# Old CI and CD:
# ---------------------------------------------------------------------------
# CI/CD pipeline definition for LingoLearn. See docs/ci.md and docs/deploy.md.
#
# The host runner executes:
# on the droplet's own runner (shell executor, tag lingolearn-deploy):
#   1. backend: install, type check, migrations on an empty test database,
#      unit and integration tests
#   2. frontend: install, type check, tests, production build
#   3. on a push to main only, and only if 1 and 2 passed: deploy. The release
#      script builds beside the live site and switches only when it all works.
#
# Pausing deploys (e.g. on demo day): set the CI/CD variable AUTO_DEPLOY to
# "false". Pushes then only test. To deploy, Build > Pipelines > Run pipeline
# on main with AUTO_DEPLOY set to "true".
