# LingoLearn behind nginx: the built frontend as static files, the API and the
# uploaded media passed to the Node server on port 4000. certbot adds the HTTPS
# server block and the redirect from http.
server {
    listen 80;
    listen [::]:80;
    server_name 159-65-118-0.sslip.io;

    root /srv/lingolearn/current/frontend/dist;
    index index.html;

    # Audio and image uploads are capped at 5 MB by the API; leave headroom.
    client_max_body_size 8m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        expires 7d;
    }

    # Built files carry a hash in their names, so they can be cached for long.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path is a page of the single-page app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
